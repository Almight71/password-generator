<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Макет десктопной раскладки (1200px)</title>
  <desc id="desc">Скелетон интерфейса: шапка, две колонки — генератор и хранилище, подвал с диаграммой SDLC.</desc>

  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
    <style>
      .lbl { fill:#ffffff; font-size:13px; font-weight:600; }
      .cap { fill:#5c6690; font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
      .box { fill:#fbfcff; stroke:#c9d0e8; stroke-width:1.5; }
      .ttl { fill:#1b2138; font-size:13px; font-weight:700; }
      .b   { fill:#5c6690; font-size:11.5px; }
      .ui  { fill:#ffffff; stroke:#b6c0ff; stroke-width:1.5; }
      .btn { fill:#7c5cff; }
      .btnt{ fill:#ffffff; font-size:11.5px; font-weight:700; }
      .muted{ fill:#eef1fb; }
      .line{ stroke:#d9def0; stroke-width:1; }
    </style>
  </defs>

  <rect width="980" height="620" fill="#f2f4fb"/>
  <rect width="980" height="44" fill="url(#hdr)"/>
  <text x="28" y="28" class="lbl" font-size="15">Макет · десктоп ≥ 1200px</text>
  <text x="952" y="28" class="lbl" text-anchor="end" opacity=".85">wireframe-desktop.svg</text>

  <!-- Каркас страницы -->
  <rect x="90" y="68" width="800" height="530" rx="12" fill="#ffffff" stroke="#c9d0e8" stroke-width="2"/>

  <!-- Шапка -->
  <rect x="90" y="68" width="800" height="56" rx="12" fill="#eef1ff"/>
  <rect x="90" y="104" width="800" height="20" fill="#eef1ff"/>
  <text x="114" y="102" class="ttl">🔐 Password Generator</text>
  <text x="866" y="102" class="b" text-anchor="end">Генератор · Хранилище · Диаграмма SDLC · Документация</text>
  <line x1="90" y1="124" x2="890" y2="124" class="line"/>

  <!-- Две колонки -->
  <text x="114" y="152" class="cap">Колонка A · генератор</text>
  <text x="508" y="152" class="cap">Колонка B · хранилище</text>

  <!-- Колонка A -->
  <rect class="box" x="114" y="164" width="370" height="410" rx="10"/>

  <rect class="ui" x="134" y="184" width="330" height="46" rx="8"/>
  <text x="148" y="212" class="b">Vg7$kQ2!mZx9#pLr</text>

  <rect class="muted" x="134" y="240" width="330" height="8" rx="4"/>
  <rect class="btn" x="134" y="240" width="268" height="8" rx="4"/>
  <text x="134" y="266" class="b">Очень сильный · ≈ 103.4 бит</text>

  <rect class="btn" x="134" y="280" width="160" height="36" rx="8"/>
  <text x="214" y="303" class="btnt" text-anchor="middle">Сгенерировать</text>
  <rect class="ui" x="304" y="280" width="160" height="36" rx="8"/>
  <text x="384" y="303" class="b" text-anchor="middle">Копировать</text>

  <line x1="134" y1="336" x2="464" y2="336" class="line"/>

  <text x="134" y="360" class="ttl">Длина: <tspan fill="#7c5cff">16</tspan></text>
  <rect class="muted" x="134" y="370" width="330" height="6" rx="3"/>
  <circle cx="297" cy="373" r="10" fill="#7c5cff"/>

  <text x="134" y="406" class="b">☑ Заглавные буквы</text>
  <text x="320" y="406" class="b">☑ Цифры</text>
  <text x="134" y="430" class="b">☑ Строчные буквы</text>
  <text x="320" y="430" class="b">☑ Спецсимволы</text>

  <line x1="134" y1="452" x2="464" y2="452" class="line"/>

  <rect class="ui" x="134" y="468" width="330" height="36" rx="8"/>
  <text x="148" y="491" class="b">Название (например, Почта)</text>

  <rect class="btn" x="134" y="514" width="330" height="36" rx="8"/>
  <text x="299" y="537" class="btnt" text-anchor="middle">Сохранить</text>

  <text x="134" y="570" class="b">Всего: 3</text>

  <!-- Колонка B -->
  <rect class="box" x="508" y="164" width="358" height="410" rx="10"/>

  <rect class="ui" x="528" y="184" width="318" height="34" rx="8"/>
  <text x="542" y="206" class="b">Поиск по названию…</text>

  <rect x="528" y="232" width="318" height="26" rx="4" fill="#eef1ff"/>
  <text x="536" y="250" class="b">Название</text>
  <text x="632" y="250" class="b">Пароль</text>
  <text x="708" y="250" class="b">Сила</text>
  <text x="770" y="250" class="b">Создан</text>
  <text x="838" y="250" class="b" text-anchor="middle">…</text>

  <g>
    <rect x="528" y="258" width="318" height="40" fill="#ffffff" stroke="#eef1fb"/>
    <text x="536" y="283" class="b">Почта</text>
    <text x="632" y="283" class="b">••••••••</text>
    <rect x="708" y="270" width="56" height="18" rx="9" fill="#eafaf2"/>
    <text x="736" y="283" class="b" text-anchor="middle">Сильный</text>
    <text x="770" y="283" class="b">20.10</text>
    <text x="838" y="283" class="b" text-anchor="middle">👁 📋</text>
    <text x="838" y="294" class="b" text-anchor="middle">🗑</text>
  </g>
  <g>
    <rect x="528" y="298" width="318" height="40" fill="#ffffff" stroke="#eef1fb"/>
    <text x="536" y="323" class="b">Telegram</text>
    <text x="632" y="323" class="b">••••••••</text>
    <rect x="708" y="310" width="56" height="18" rx="9" fill="#eafaf2"/>
    <text x="736" y="323" class="b" text-anchor="middle">Оч.сильн</text>
    <text x="770" y="323" class="b">20.10</text>
    <text x="838" y="323" class="b" text-anchor="middle">👁 📋</text>
    <text x="838" y="334" class="b" text-anchor="middle">🗑</text>
  </g>
  <g>
    <rect x="528" y="338" width="318" height="40" fill="#ffffff" stroke="#eef1fb"/>
    <text x="536" y="363" class="b">Bank Alpha</text>
    <text x="632" y="363" class="b">••••••••</text>
    <rect x="708" y="350" width="56" height="18" rx="9" fill="#eafaf2"/>
    <text x="736" y="363" class="b" text-anchor="middle">Сильный</text>
    <text x="770" y="363" class="b">19.10</text>
    <text x="838" y="363" class="b" text-anchor="middle">👁 📋</text>
    <text x="838" y="374" class="b" text-anchor="middle">🗑</text>
  </g>

  <rect class="ui" x="528" y="514" width="180" height="34" rx="8"/>
  <text x="618" y="536" class="b" text-anchor="middle">Очистить все</text>

  <text x="746" y="570" class="b" text-anchor="middle">Таблица переносится в карточки при &lt; 720px</text>

  <!-- Подсказки сетки -->
  <text x="490" y="610" class="b" text-anchor="middle">Сетка: max-width 1200px · две колонки 1fr 1fr · gap 24px · карточки с тенью</text>
</svg>
