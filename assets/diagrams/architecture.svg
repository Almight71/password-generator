<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="980" height="720" font-family="'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура Password Generator with Storage</title>
  <desc id="desc">Пять слоёв приложения: утилиты, домен, данные, представление и оркестратор. Снаружи — DOM и localStorage.</desc>

  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c8db5"/>
    </marker>
    <style>
      .t   { fill:#1b2138; font-size:14px; }
      .b   { fill:#5c6690; font-size:12px; }
      .lbl { fill:#ffffff; font-size:14px; font-weight:600; }
      .cap { fill:#5c6690; font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
      .box { stroke:#d9def0; stroke-width:1.5; rx:10; }
      .line{ stroke:#7c8db5; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="980" height="720" fill="#f2f4fb"/>

  <!-- Заголовок -->
  <rect x="0" y="0" width="980" height="56" fill="url(#hdr)"/>
  <text x="28" y="35" class="lbl" font-size="18">Password Generator with Storage — схема слоёв</text>
  <text x="952" y="35" class="lbl" text-anchor="end" opacity=".85">v1.0.0</text>

  <!-- Браузер -->
  <rect x="24" y="80" width="932" height="616" rx="14" fill="#ffffff" stroke="#c9d0e8" stroke-width="2"/>
  <text x="44" y="108" class="cap">Среда выполнения · браузер пользователя</text>

  <!-- Страница -->
  <rect x="48" y="122" width="884" height="418" rx="12" fill="#fbfcff" stroke="#c9d0e8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="68" y="148" class="t" font-weight="700">src/index.html  (или src/sdlc_cycle.html)</text>
  <text x="68" y="168" class="b">Загружает скрипты строго в порядке: utils → generator → storage → ui → app</text>

  <!-- Слои -->
  <rect class="box" x="80" y="188" width="820" height="56" fill="#eef1ff"/>
  <text x="100" y="212" class="t" font-weight="700">utils.js</text>
  <text x="100" y="232" class="b">Константы · clamp · escapeHtml · sanitizeInput · validateName · calculateEntropyBits · createId</text>
  <text x="880" y="222" class="cap" text-anchor="end">Слой 1 · без зависимостей</text>

  <rect class="box" x="80" y="256" width="400" height="72" fill="#eafaf2"/>
  <text x="100" y="282" class="t" font-weight="700">generator.js · PasswordGenerator</text>
  <text x="100" y="302" class="b">secureRandomInt (CSPRNG) · shuffle · generate</text>
  <text x="100" y="320" class="b">calculateStrength · estimateBits</text>
  <text x="462" y="296" class="cap" text-anchor="end">Слой 2</text>

  <rect class="box" x="500" y="256" width="400" height="72" fill="#fff6e8"/>
  <text x="520" y="282" class="t" font-weight="700">storage.js · PasswordStorage · MemoryStore</text>
  <text x="520" y="302" class="b">load · save · add · remove · clear · search</text>
  <text x="520" y="320" class="b">normalizeRecord · migrateLegacyData</text>
  <text x="882" y="296" class="cap" text-anchor="end">Слой 3</text>

  <rect class="box" x="80" y="340" width="820" height="64" fill="#eef1ff"/>
  <text x="100" y="366" class="t" font-weight="700">ui.js · UIManager</text>
  <text x="100" y="386" class="b">setPassword · setStrength · renderTable · renderRow · toast · confirm · setCounter</text>
  <text x="880" y="372" class="cap" text-anchor="end">Слой 4 · DOM</text>

  <rect x="80" y="416" width="820" height="72" rx="10" fill="#7c5cff"/>
  <text x="100" y="444" class="lbl">app.js · PasswordApp — оркестратор</text>
  <text x="100" y="466" class="lbl" opacity=".85">init · bindEvents · readOptions · generate · copyCurrent · saveCurrent · deleteRecord · render</text>
  <text x="880" y="454" class="lbl" opacity=".8" text-anchor="end">Слой 5</text>

  <!-- Точки снаружи -->
  <rect class="box" x="80" y="560" width="396" height="104" fill="#ffffff"/>
  <text x="100" y="586" class="t" font-weight="700">localStorage</text>
  <text x="100" y="606" class="b">Ключ «passwords_v1» — массив записей схемы v1</text>
  <text x="100" y="624" class="b">Миграция из легаси-ключа «passwords»</text>
  <text x="100" y="648" class="b" fill="#c0392b">Открытый текст · данные не покидают устройство</text>

  <rect class="box" x="504" y="560" width="396" height="104" fill="#ffffff"/>
  <text x="524" y="586" class="t" font-weight="700">Web API браузера</text>
  <text x="524" y="606" class="b">crypto.getRandomValues — генерация</text>
  <text x="524" y="624" class="b">navigator.clipboard — копирование (secure context)</text>
  <text x="524" y="642" class="b">Intl.DateTimeFormat — формат дат</text>

  <!-- Связи -->
  <path class="line" d="M280,416 L280,404"/>
  <path class="line" d="M700,416 L700,404"/>
  <path class="line" d="M490,452 L470,452 L470,560"/>
  <path class="line" d="M560,452 L580,452 L580,560"/>
  <path class="line" d="M120,328 L120,340"/>
  <path class="line" d="M120,260 L120,244"/>
  <path class="line" d="M600,260 L600,244"/>

  <text x="490" y="712" class="b" text-anchor="middle">Зависимости направлены только «вниз»: домен и данные никогда не обращаются к DOM.</text>
</svg>
