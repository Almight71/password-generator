<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Потоки данных Password Generator</title>
  <desc id="desc">Четыре сценария: генерация, сохранение, загрузка страницы, копирование.</desc>

  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6c96"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c5cff"/>
    </marker>
    <style>
      .lbl { fill:#ffffff; font-size:13px; font-weight:600; }
      .cap { fill:#5c6690; font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
      .b   { fill:#5c6690; font-size:11.5px; }
      .t   { fill:#1b2138; font-size:12.5px; }
      .node{ fill:#ffffff; stroke:#c9d0e8; stroke-width:1.5; }
      .flow{ stroke:#5f6c96; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      .key { stroke:#7c5cff; stroke-width:2; fill:none; marker-end:url(#arrow2); }
    </style>
  </defs>

  <rect width="980" height="640" fill="#f2f4fb"/>
  <rect width="980" height="56" fill="url(#hdr)"/>
  <text x="28" y="35" class="lbl" font-size="18">Потоки данных</text>
  <text x="952" y="35" class="lbl" text-anchor="end" opacity=".85">4 сценария</text>

  <!-- ========== 1. Генерация ========== -->
  <text x="28" y="92" class="cap">1 · Генерация пароля</text>
  <line x1="28" y1="100" x2="952" y2="100" stroke="#d9def0"/>

  <rect class="node" x="28" y="116" width="132" height="46" rx="8"/>
  <text x="94" y="138" class="t" text-anchor="middle" font-weight="600">Чекбоксы</text>
  <text x="94" y="154" class="b" text-anchor="middle">+ слайдер</text>

  <rect class="node" x="212" y="116" width="132" height="46" rx="8"/>
  <text x="278" y="138" class="t" text-anchor="middle" font-weight="600">readOptions()</text>
  <text x="278" y="154" class="b" text-anchor="middle">app.js</text>

  <rect class="node" x="396" y="116" width="164" height="46" rx="8"/>
  <text x="478" y="138" class="t" text-anchor="middle" font-weight="600">generate(options)</text>
  <text x="478" y="154" class="b" text-anchor="middle">generator.js</text>

  <rect class="node" x="612" y="116" width="150" height="46" rx="8"/>
  <text x="687" y="138" class="t" text-anchor="middle" font-weight="600">setPassword()</text>
  <text x="687" y="154" class="b" text-anchor="middle">ui.js · textContent</text>

  <rect class="node" x="814" y="116" width="138" height="46" rx="8" fill="#eef1ff" stroke="#b6c0ff"/>
  <text x="883" y="138" class="t" text-anchor="middle" font-weight="600">Полоса силы</text>
  <text x="883" y="154" class="b" text-anchor="middle">bits / 128</text>

  <path class="flow" d="M160,139 L212,139"/>
  <path class="flow" d="M344,139 L396,139"/>
  <path class="key"  d="M560,139 L612,139"/>
  <path class="flow" d="M762,139 L814,139"/>

  <text x="490" y="186" class="b" text-anchor="middle">событие «input»/«change» порождает повторную генерацию — состояние поля всегда актуально</text>

  <!-- ========== 2. Сохранение ========== -->
  <text x="28" y="228" class="cap">2 · Сохранение</text>
  <line x1="28" y1="236" x2="952" y2="236" stroke="#d9def0"/>

  <rect class="node" x="28" y="252" width="132" height="46" rx="8"/>
  <text x="94" y="274" class="t" text-anchor="middle" font-weight="600">«Сохранить»</text>
  <text x="94" y="290" class="b" text-anchor="middle">или Enter</text>

  <rect class="node" x="212" y="252" width="132" height="46" rx="8"/>
  <text x="278" y="274" class="t" text-anchor="middle" font-weight="600">validateName()</text>
  <text x="278" y="290" class="b" text-anchor="middle">utils.js</text>

  <rect class="node" x="396" y="252" width="164" height="46" rx="8"/>
  <text x="478" y="274" class="t" text-anchor="middle" font-weight="600">add(data)</text>
  <text x="478" y="290" class="b" text-anchor="middle">storage.js · createId</text>

  <rect class="node" x="612" y="252" width="150" height="46" rx="8" fill="#fff6e8" stroke="#f0d39a"/>
  <text x="687" y="274" class="t" text-anchor="middle" font-weight="600">localStorage</text>
  <text x="687" y="290" class="b" text-anchor="middle">setItem(JSON)</text>

  <rect class="node" x="814" y="252" width="138" height="46" rx="8"/>
  <text x="883" y="274" class="t" text-anchor="middle" font-weight="600">render() + toast</text>
  <text x="883" y="290" class="b" text-anchor="middle">таблица, счётчик</text>

  <path class="flow" d="M160,275 L212,275"/>
  <path class="flow" d="M344,275 L396,275"/>
  <path class="key"  d="M560,275 L612,275"/>
  <path class="flow" d="M762,275 L814,275"/>

  <text x="490" y="322" class="b" text-anchor="middle">отказ валидации → тост с причиней и выход без записи в хранилище</text>

  <!-- ========== 3. Загрузка страницы ========== -->
  <text x="28" y="364" class="cap">3 · Загрузка страницы (DOMContentLoaded)</text>
  <line x1="28" y1="372" x2="952" y2="372" stroke="#d9def0"/>

  <rect class="node" x="28" y="388" width="150" height="46" rx="8"/>
  <text x="103" y="410" class="t" text-anchor="middle" font-weight="600">bootstrapApp()</text>
  <text x="103" y="426" class="b" text-anchor="middle">app.js</text>

  <rect class="node" x="230" y="388" width="150" height="46" rx="8"/>
  <text x="305" y="410" class="t" text-anchor="middle" font-weight="600">new PasswordApp</text>
  <text x="305" y="426" class="b" text-anchor="middle">.init()</text>

  <rect class="node" x="432" y="388" width="150" height="46" rx="8" fill="#fff6e8" stroke="#f0d39a"/>
  <text x="507" y="410" class="t" text-anchor="middle" font-weight="600">load()</text>
  <text x="507" y="426" class="b" text-anchor="middle">JSON.parse / миграция</text>

  <rect class="node" x="634" y="388" width="150" height="46" rx="8"/>
  <text x="709" y="410" class="t" text-anchor="middle" font-weight="600">bindEvents()</text>
  <text x="709" y="426" class="b" text-anchor="middle">делегирование</text>

  <rect class="node" x="836" y="388" width="116" height="46" rx="8"/>
  <text x="894" y="410" class="t" text-anchor="middle" font-weight="600">generate()</text>
  <text x="894" y="426" class="b" text-anchor="middle">первый пароль</text>

  <path class="flow" d="M178,411 L230,411"/>
  <path class="flow" d="M380,411 L432,411"/>
  <path class="flow" d="M582,411 L634,411"/>
  <path class="flow" d="M784,411 L836,411"/>

  <path class="flow" d="M507,434 L507,456 L94 L456 L94,434"/>
  <text x="300" y="474" class="b">битый JSON → [] · легаси-ключ → миграция в passwords_v1</text>

  <!-- ========== 4. Копирование ========== -->
  <text x="28" y="512" class="cap">4 · Копирование</text>
  <line x1="28" y1="520" x2="952" y2="520" stroke="#d9def0"/>

  <rect class="node" x="28" y="536" width="150" height="46" rx="8"/>
  <text x="103" y="558" class="t" text-anchor="middle" font-weight="600">«Копировать»</text>
  <text x="103" y="574" class="b" text-anchor="middle">copyCurrent()</text>

  <rect class="node" x="230" y="536" width="180" height="46" rx="8"/>
  <text x="320" y="558" class="t" text-anchor="middle" font-weight="600">isSecureContext?</text>
  <text x="320" y="574" class="b" text-anchor="middle">https / localhost</text>

  <rect class="node" x="480" y="536" width="180" height="46" rx="8" fill="#eafaf2" stroke="#9fdcbd"/>
  <text x="570" y="558" class="t" text-anchor="middle" font-weight="600">navigator.clipboard</text>
  <text x="570" y="574" class="b" text-anchor="middle">writeText</text>

  <rect class="node" x="480" y="536" width="180" height="0" fill="none"/>
  <rect class="node" x="740" y="536" width="212" height="46" rx="8" fill="#eafaf2" stroke="#9fdcbd"/>
  <text x="846" y="558" class="t" text-anchor="middle" font-weight="600">execCommand('copy') — фоллбэк</text>
  <text x="846" y="574" class="b" text-anchor="middle">file:// и старые браузеры</text>

  <path class="flow" d="M178,559 L230,559"/>
  <path class="flow" d="M410,545 L445,545 L445,520 L570,520 L570,536"/>
  <path class="flow" d="M410,573 L445,573 L445,600 L846,600 L846,582"/>

  <text x="490" y="628" class="b" text-anchor="middle">неудача на любом шаге → тост «Не удалось скопировать», приложение продолжает работать</text>
</svg>
