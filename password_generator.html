<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор паролей</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .section-title {
            font-size: 1.3em;
            color: #667eea;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        /* Генератор */
        .length-control {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .length-value {
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            min-width: 50px;
            text-align: center;
            font-weight: bold;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        label {
            cursor: pointer;
            font-size: 1em;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-copy {
            background: #4CAF50;
            color: white;
        }

        .btn-copy:hover {
            background: #45a049;
        }

        .btn-delete {
            background: #f44336;
            color: white;
            padding: 8px 16px;
            width: auto;
        }

        .btn-delete:hover {
            background: #da190b;
        }

        .btn-clear {
            background: #ff9800;
            color: white;
        }

        .btn-clear:hover {
            background: #e68900;
        }

        .password-display {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Courier New', monospace;
            font-size: 1.1em;
        }

        .password-text {
            flex: 1;
            word-break: break-all;
            user-select: all;
        }

        .strength-indicator {
            height: 6px;
            background: #ddd;
            border-radius: 3px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .strength-weak { background: #f44336; width: 33%; }
        .strength-medium { background: #ff9800; width: 66%; }
        .strength-strong { background: #4CAF50; width: 100%; }

        .strength-text {
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        /* Сохранение пароля */
        .save-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-save {
            background: #2196F3;
            color: white;
            padding: 12px 30px;
        }

        .btn-save:hover {
            background: #0b7dda;
        }

        /* Таблица паролей */
        .passwords-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .passwords-table thead {
            background: #f5f5f5;
        }

        .passwords-table th {
            padding: 12px;
            text-align: left;
            border-bottom: 2px solid #667eea;
            font-weight: 600;
            color: #667eea;
        }

        .passwords-table td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .passwords-table tr:hover {
            background: #f9f9f9;
        }

        .password-cell {
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }

        .masked {
            letter-spacing: 2px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85em;
            width: auto;
            flex-shrink: 0;
        }

        .btn-toggle {
            background: #2196F3;
            color: white;
        }

        .btn-toggle:hover {
            background: #0b7dda;
        }

        .date-cell {
            font-size: 0.85em;
            color: #666;
        }

        .strength-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .strength-badge-weak {
            background: #ffebee;
            color: #c62828;
        }

        .strength-badge-medium {
            background: #fff3e0;
            color: #e65100;
        }

        .strength-badge-strong {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .empty-message {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-style: italic;
        }

        .search-box {
            margin-bottom: 20px;
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .options {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .save-form {
                flex-direction: column;
            }

            .passwords-table {
                font-size: 0.9em;
            }

            .passwords-table th,
            .passwords-table td {
                padding: 8px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Генератор паролей</h1>

        <!-- Генератор -->
        <div class="card">
            <h2 class="section-title">Создать новый пароль</h2>

            <div class="length-control">
                <label for="length">Длина:</label>
                <input type="range" id="length" min="4" max="32" value="16">
                <div class="length-value" id="lengthValue">16</div>
            </div>

            <div class="options">
                <div class="checkbox-group">
                    <input type="checkbox" id="uppercase" checked>
                    <label for="uppercase">Прописные (A-Z)</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="lowercase" checked>
                    <label for="lowercase">Строчные (a-z)</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="numbers" checked>
                    <label for="numbers">Цифры (0-9)</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="symbols" checked>
                    <label for="symbols">Спецсимволы (!@#$%^&*)</label>
                </div>
            </div>

            <div class="button-group">
                <button class="btn-generate" onclick="generatePassword()">Сгенерировать</button>
            </div>

            <div id="successMessage" class="success-message"></div>

            <div class="password-display">
                <div class="password-text" id="password">Нажмите "Сгенерировать"</div>
                <button class="btn-copy" onclick="copyPassword()">📋 Копировать</button>
            </div>

            <div class="strength-indicator">
                <div class="strength-bar" id="strengthBar"></div>
            </div>
            <div class="strength-text">
                Сила: <span id="strengthText">—</span>
            </div>

            <!-- Сохранение -->
            <h3 class="section-title" style="margin-top: 30px;">Сохранить пароль</h3>
            <div class="save-form">
                <input type="text" id="passwordName" placeholder="Для чего? (например: Gmail, Twitter, Банк)">
                <button class="btn-save" onclick="savePassword()">Сохранить</button>
            </div>
        </div>

        <!-- Хранилище паролей -->
        <div class="card">
            <h2 class="section-title">Мои пароли</h2>

            <input type="text" id="searchBox" class="search-box" placeholder="🔍 Поиск по названию...">

            <div id="passwordsList"></div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'passwords';
        let currentPassword = '';

        // Обновление значения длины
        document.getElementById('length').addEventListener('input', (e) => {
            document.getElementById('lengthValue').textContent = e.target.value;
        });

        // Генерация пароля
        function generatePassword() {
            const length = parseInt(document.getElementById('length').value);
            const uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const lowercase = 'abcdefghijklmnopqrstuvwxyz';
            const numbers = '0123456789';
            const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';

            let chars = '';
            if (document.getElementById('uppercase').checked) chars += uppercase;
            if (document.getElementById('lowercase').checked) chars += lowercase;
            if (document.getElementById('numbers').checked) chars += numbers;
            if (document.getElementById('symbols').checked) chars += symbols;

            if (chars === '') {
                alert('Выберите хотя бы одну опцию!');
                return;
            }

            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            currentPassword = password;
            document.getElementById('password').textContent = password;
            updateStrength(password);
        }

        // Проверка силы пароля
        function updateStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            let strengthText = 'Слабый';
            let strengthClass = 'strength-weak';

            if (strength >= 4) {
                strengthText = 'Сильный';
                strengthClass = 'strength-strong';
            } else if (strength >= 2) {
                strengthText = 'Средний';
                strengthClass = 'strength-medium';
            }

            document.getElementById('strengthText').textContent = strengthText;
            const bar = document.getElementById('strengthBar');
            bar.className = 'strength-bar ' + strengthClass;
        }

        // Копирование пароля
        function copyPassword() {
            if (!currentPassword) {
                alert('Сначала сгенерируйте пароль!');
                return;
            }

            navigator.clipboard.writeText(currentPassword).then(() => {
                showSuccess('Пароль скопирован в буфер обмена!');
            });
        }

        // Сохранение пароля
        function savePassword() {
            if (!currentPassword) {
                alert('Сначала сгенерируйте пароль!');
                return;
            }

            const name = document.getElementById('passwordName').value.trim();
            if (!name) {
                alert('Введите название для пароля!');
                return;
            }

            const passwords = getPasswords();
            const newPassword = {
                id: Date.now(),
                name: name,
                password: currentPassword,
                createdAt: new Date().toLocaleDateString('ru-RU'),
                strength: getStrengthLevel(currentPassword)
            };

            passwords.push(newPassword);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(passwords));

            document.getElementById('passwordName').value = '';
            showSuccess('Пароль сохранен!');
            renderPasswords();
        }

        // Получение силы пароля
        function getStrengthLevel(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            if (strength >= 4) return 'strong';
            if (strength >= 2) return 'medium';
            return 'weak';
        }

        // Получение паролей из localStorage
        function getPasswords() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        // Отображение паролей
        function renderPasswords(search = '') {
            let passwords = getPasswords();

            if (search) {
                passwords = passwords.filter(p =>
                    p.name.toLowerCase().includes(search.toLowerCase())
                );
            }

            const list = document.getElementById('passwordsList');

            if (passwords.length === 0) {
                list.innerHTML = '<div class="empty-message">Нет сохраненных паролей. Создайте и сохраните первый!</div>';
                return;
            }

            let html = '<table class="passwords-table"><thead><tr><th>Название</th><th>Пароль</th><th>Сила</th><th>Дата</th><th>Действия</th></tr></thead><tbody>';

            passwords.forEach(pwd => {
                const strengthBadge = {
                    'weak': 'strength-badge-weak',
                    'medium': 'strength-badge-medium',
                    'strong': 'strength-badge-strong'
                }[pwd.strength];

                const strengthLabel = {
                    'weak': 'Слабый',
                    'medium': 'Средний',
                    'strong': 'Сильный'
                }[pwd.strength];

                html += `
                    <tr>
                        <td>${escapeHtml(pwd.name)}</td>
                        <td class="password-cell">
                            <span class="password-content-${pwd.id} masked">••••••••••••••••</span>
                        </td>
                        <td><span class="strength-badge ${strengthBadge}">${strengthLabel}</span></td>
                        <td class="date-cell">${pwd.createdAt}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn-toggle btn-small" onclick="togglePassword(${pwd.id})">👁️ Показать</button>
                                <button class="btn-copy btn-small" onclick="copyPasswordFromList(${pwd.id})">📋</button>
                                <button class="btn-delete btn-small" onclick="deletePassword(${pwd.id})">🗑️</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            list.innerHTML = html;
        }

        // Показать/скрыть пароль
        function togglePassword(id) {
            const passwords = getPasswords();
            const pwd = passwords.find(p => p.id === id);
            const element = document.querySelector(`.password-content-${id}`);

            if (element.classList.contains('masked')) {
                element.textContent = pwd.password;
                element.classList.remove('masked');
            } else {
                element.textContent = '••••••••••••••••';
                element.classList.add('masked');
            }
        }

        // Копирование пароля из списка
        function copyPasswordFromList(id) {
            const passwords = getPasswords();
            const pwd = passwords.find(p => p.id === id);
            navigator.clipboard.writeText(pwd.password).then(() => {
                showSuccess('Пароль "' + pwd.name + '" скопирован!');
            });
        }

        // Удаление пароля
        function deletePassword(id) {
            if (confirm('Вы уверены, что хотите удалить этот пароль?')) {
                let passwords = getPasswords();
                passwords = passwords.filter(p => p.id !== id);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(passwords));
                renderPasswords();
                showSuccess('Пароль удален!');
            }
        }

        // Поиск
        document.getElementById('searchBox').addEventListener('input', (e) => {
            renderPasswords(e.target.value);
        });

        // Сообщение об успехе
        function showSuccess(message) {
            const msg = document.getElementById('successMessage');
            msg.textContent = '✓ ' + message;
            msg.classList.add('show');
            setTimeout(() => {
                msg.classList.remove('show');
            }, 3000);
        }

        // Экранирование HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Инициализация
        renderPasswords();

        // Генерировать пароль при загрузке
        generatePassword();
    </script>
</body>
</html>
